<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UAV Mapping 101</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f7;--panel:#fff;--ink:#17202b;--muted:#5d6876;--line:#d9e0e7;--grid:#e8edf2;--accent:#0b63c5;--accent-soft:rgba(11,99,197,.08);--ok:#1b7f3b;--warn:#965a00;--bad:#c42b2b;--site:#b9c4cf}
@media (prefers-color-scheme:dark){:root{--bg:#0e1319;--panel:#151c24;--ink:#e3e9ef;--muted:#8d99a6;--line:#27313d;--grid:#1b242e;--accent:#4ea1ff;--accent-soft:rgba(78,161,255,.1);--ok:#4cc27a;--warn:#e0a03a;--bad:#ff6b6b;--site:#3d4957}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "IBM Plex Sans",system-ui,sans-serif}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{font-size:17px;margin:0;font-weight:600}
.sub{margin:0;color:var(--muted);font-size:13px}
.steps{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.pill{flex:none;font:inherit;font-size:13px;color:var(--ink);background:none;border:1px solid var(--line);border-radius:4px;padding:5px 10px;cursor:pointer}
.pill .n{font-family:"IBM Plex Mono",monospace;color:var(--muted);margin-right:4px}
.pill[aria-current=step]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.wrap{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:20px;max-width:1280px;margin:0 auto;padding:20px 16px}
.eyebrow{font:500 11px "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 6px}
h2{font-size:24px;line-height:1.2;margin:0 0 12px;font-weight:600}
.text p{margin:0 0 12px}
.try{margin:0 0 16px;padding:10px 12px 10px 28px;background:var(--panel);border:1px solid var(--line);border-radius:6px;font-size:14px}
.try li{margin:2px 0}
.ctl{margin:14px 0}
.ctl label{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:4px}
.ctl label b{font:500 13px "IBM Plex Mono",monospace;color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--accent)}
.readouts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:16px 0}
.ro{background:var(--panel);padding:8px 10px;font:inherit;color:inherit;text-align:left;border:0}
button.ro{cursor:pointer}
button.ro:hover{background:var(--accent-soft)}
.ro span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.ro b{font:500 17px "IBM Plex Mono",monospace}
.warns{list-style:none;padding:0;margin:0 0 12px;font-size:13px}
.warns li{padding:6px 10px;border-left:3px solid var(--warn);background:var(--panel);margin-bottom:4px}
.warns li.bad{border-color:var(--bad)}
.warns li.ok{border-color:var(--ok)}
.take{border-left:3px solid var(--accent);padding:8px 12px;background:var(--accent-soft);font-size:14px;margin-top:16px}
.stagebox{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;align-self:start;position:sticky;top:12px}
canvas{display:block;width:100%;aspect-ratio:8/5}
canvas[hidden]{display:none}
canvas.drag{touch-action:none;cursor:crosshair}
.caption{margin:8px 2px 0;font-size:13px;color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.b{font:inherit;font-size:13px;padding:6px 12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:4px;cursor:pointer}
.b:hover:not(:disabled){border-color:var(--accent)}
.b:disabled{opacity:.4;cursor:default}
.b[aria-pressed=true]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.b.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.switch{display:inline-flex;align-items:center;gap:10px;font:inherit;font-size:14px;background:none;border:0;color:var(--ink);cursor:pointer;padding:4px 0}
.switch>span:first-child{width:38px;height:22px;border-radius:11px;background:var(--line);position:relative;transition:background .2s}
.switch>span:first-child::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--panel);transition:left .2s}
.switch[aria-checked=true]>span:first-child{background:var(--accent)}
.switch[aria-checked=true]>span:first-child::after{left:19px}
.term{border-bottom:1px dotted var(--accent);cursor:help;position:relative}
.term:hover::after,.term:focus::after{content:attr(data-def);position:absolute;left:0;top:1.7em;width:max-content;max-width:min(260px,70vw);background:var(--ink);color:var(--bg);font-size:13px;line-height:1.4;font-weight:400;padding:8px 10px;border-radius:4px;z-index:5}
.pager{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:1280px;margin:0 auto;padding:0 16px 24px}
.pager span{font-size:13px;color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:860px){.wrap{grid-template-columns:1fr}.stagebox{order:-1;position:static}h2{font-size:21px}}
</style>
</head>
<body>
<header class="top">
  <div><h1>UAV Mapping 101</h1><p class="sub">How a drone turns photos into an accurate map</p></div>
</header>
<nav class="steps" id="steps" aria-label="Topics"></nav>
<main class="wrap">
  <section class="text" id="text"></section>
  <section class="stagebox">
    <canvas id="cv" role="img"></canvas>
    <canvas id="cv3" role="img" hidden></canvas>
    <p class="caption" id="caption"></p>
  </section>
</main>
<footer class="pager">
  <button class="b" id="prev">← Back</button>
  <span id="pos"></span>
  <button class="b primary" id="next">Next →</button>
</footer>
<script>
const $ = s => document.querySelector(s);
const cv = $('#cv'), cv3 = $('#cv3'), ctx = cv.getContext('2d');
const W = 800, H = 500;                       // logical canvas size
const OX = 80, OY = 50, MS = 1.6;             // site map: offset + px per meter
const SITE = { w: 400, h: 250 };              // site size, meters
// rgb: 1" sensor, 8.8 mm lens (Phantom 4 RTK class). multi ~ MicaSense-class 5-band. lidar ~ Zenmuse L1-class (fov deg, pulses/s).
const SENS = {
  rgb:   { name: 'RGB camera', sw: 13.2, f: 8.8, iw: 5472, ih: 3648 },
  multi: { name: 'Multispectral camera', sw: 4.8, f: 5.5, iw: 1456, ih: 1088 },
  lidar: { name: 'LiDAR scanner', fov: 70, rate: 240000 }
};
// endur = usable mission minutes per battery (20% reserve already taken off)
const DRONES = {
  quad:  { name: 'Multirotor', speed: 12, turn: 8, minInt: 2, endur: { rgb: 22, multi: 20, lidar: 18 } },
  fixed: { name: 'Fixed-wing', speed: 16, turn: 12, minInt: 1, R: 60, endur: { rgb: 55, multi: 50 } } // no lidar
};
const SCN = {
  site: { name: 'Construction site', label: 'CONSTRUCTION SITE', need: .05, best: 'rgb', q: 'How much soil has been dug out, and how much gravel is left in the piles?', who: 'Site engineer' },
  farm: { name: 'Farm field', label: 'FARM FIELD', need: .30, best: 'multi', q: 'Which parts of the crop are struggling, and where does water pool after rain?', who: 'Farmer' },
  town: { name: 'Town block', label: 'TOWN BLOCK', need: .10, best: 'lidar', q: 'How tall are the buildings, and which streets would flood first?', who: 'Town planner' }
};
// site meters. road = bezier [p0,c1,c2,p1]; bldg [x,y,w,h,ht]; tree/pile [x,y,r,ht]; pit [x,y,w,h,depth]; low [x,y,r,depth]; rows [y0,y1,step]; stress [x,y,rx,ry]
const FEAT = {
  town: { road: [[-20, 178], [120, 205], [260, 105], [420, 125]],
    bldg: [[40, 30, 50, 35, 12], [105, 40, 30, 45, 14.2], [300, 178, 60, 40, 9], [225, 185, 45, 30, 6]],
    tree: [[250, 60, 18, 11], [290, 74, 12, 8], [160, 115, 14, 9]], low: [[200, 190, 25, .6]],
    notes: [[118, 62, 'buildings', 30], [250, 60, 'trees', 34], [150, 195, 'street']] },
  site: { road: [[-20, 40], [100, 60], [200, 20], [420, 50]],
    bldg: [[20, 190, 30, 12, 3], [55, 190, 30, 12, 3]], pile: [[250, 70, 20, 8], [310, 80, 14, 5]],
    pit: [[120, 110, 80, 50, 3]], tree: [[380, 220, 10, 7]],
    notes: [[260, 75, 'stockpiles'], [160, 135, 'excavation'], [100, 50, 'haul road']] },
  farm: { road: [[-20, 235], [150, 238], [300, 232], [420, 236]],
    bldg: [[350, 20, 35, 22, 7]], tree: [[20, 15, 8, 10], [40, 12, 9, 10], [60, 16, 8, 10]],
    rows: [30, 220, 8], low: [[90, 180, 30, .22]], stress: [260, 120, 90, 60],
    notes: [[200, 120, 'crop rows'], [90, 180, 'wet corner', 54], [200, 218, 'farm track']] }
};
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

// Every viewer choice lives here, so later topics react to earlier ones.
const S = { alt: 100, overlap: 75, rtk: false, gcps: [], amp: 2.5, trail: [], lastTrail: 0, shown: null, err: null,
  scenario: 'site', uav: 'quad', sensor: 'rgb', wind: 3, view: 'cloud', ana: 0, note: null };

const G = {
  gsd: 'Ground Sampling Distance: how much ground one pixel covers. 2 cm/px means each pixel is a 2 × 2 cm patch. Smaller = sharper.',
  overlap: 'How much of each photo also appears in the next one. Mapping usually needs 70–80%.',
  gnss: 'Global Navigation Satellite System: GPS (USA), Galileo (EU), GLONASS (Russia), BeiDou (China). Your phone uses it too.',
  rtk: 'Real-Time Kinematic: a base station on a known point sends live corrections, turning meter-level positions into centimeter-level ones.',
  gcp: 'Ground Control Point: a marked target on the ground whose coordinates a surveyor measured precisely.',
  bm: 'Benchmark: a permanent survey marker (often a concrete pillar) with officially known coordinates and height.',
  icp: 'Checkpoints: surveyed targets left OUT of processing, used only to test how accurate the finished map is.',
  rmse: 'Root Mean Square Error: roughly the "typical" error across all checkpoints. Smaller is better.',
  uav: 'Unmanned Aerial Vehicle: the official name for a drone.',
  multirotor: 'A drone with four or more propellers. It hovers and turns on the spot, but a battery lasts only 20–40 minutes.',
  fixedwing: 'A drone with wings, like a small plane. It flies longer and faster, but can\'t hover and needs wide turns.',
  vtol: 'Vertical Take-Off and Landing: a fixed-wing that lifts off like a helicopter, then flies like a plane.',
  rgb: 'A normal color camera. It records red, green and blue light, like your phone.',
  multispectral: 'A camera that records several narrow bands of light, including near-infrared, which our eyes can\'t see.',
  ndvi: 'Normalized Difference Vegetation Index: a plant-health score from red and near-infrared light. Healthy leaves score high.',
  lidar: 'Light Detection And Ranging: a laser scanner that measures distance by timing how long each pulse takes to bounce back.',
  imu: 'Inertial Measurement Unit: motion sensors that track the drone\'s tilt and turn hundreds of times a second.',
  ppk: 'Post-Processed Kinematic: like RTK, but the corrections are applied after the flight instead of live.',
  gcs: 'Ground Control Station: the controller or tablet app the pilot uses to plan, upload and watch a flight.',
  waypoint: 'A point in the sky (position + height) the drone flies to. A mapping mission is a list of them.',
  telemetry: 'Live data the drone radios down: position, height, speed, battery and more.',
  rth: 'Return-to-Home: the drone flies back to its takeoff point by itself, e.g. when the battery is low or the radio link is lost.',
  photogrammetry: 'Measuring from photos. Overlapping photos taken from different spots let software compute 3D shape.',
  tie: 'Tie points: the same small detail recognized in several photos. They "tie" the photos together.',
  pointcloud: 'A 3D model made of millions of separate dots, each with a position and often a color.',
  dsm: 'Digital Surface Model: a height map including roofs and treetops. A DTM is the same with buildings and trees removed: bare ground.',
  ortho: 'Orthomosaic: stitched photos corrected so every spot is seen straight from above. You can measure on it like a map.',
  swath: 'The strip of ground a LiDAR scans in one pass.'
};
const term = (k, label) => `<span class="term" data-t="${k}">${label}</span>`;
const ro = (id, label) => `<div class="ro"><span>${label}</span><b id="${id}">–</b></div>`;
const fmtErr = m => m < 1 ? Math.round(m * 100) + ' cm' : m.toFixed(1) + ' m';
const fmtTime = s => { s = Math.round(s); return Math.floor(s / 60) + ' min ' + String(s % 60).padStart(2, '0') + ' s'; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const px = (x, y) => [OX + x * MS, OY + y * MS];

/* ---------- colors + canvas helpers ---------- */
const C = {};
function readColors() {
  const cs = getComputedStyle(document.documentElement);
  for (const k of ['panel', 'ink', 'muted', 'line', 'grid', 'accent', 'ok', 'warn', 'bad', 'site']) C[k] = cs.getPropertyValue('--' + k).trim();
}
function txt(s, x, y, o = {}) {
  ctx.font = `${o.weight || 400} ${o.size || 11}px ${o.sans ? '"IBM Plex Sans",sans-serif' : '"IBM Plex Mono",monospace'}`;
  ctx.fillStyle = o.color || C.muted; ctx.textAlign = o.align || 'left'; ctx.fillText(s, x, y);
}
function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function drawGrid(step, ox, oy) {
  ctx.strokeStyle = C.grid; ctx.lineWidth = 1; ctx.setLineDash([]); ctx.beginPath();
  for (let x = ox % step; x <= W; x += step) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = oy % step; y <= H; y += step) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
}
function drawSite() {
  const F = FEAT[S.scenario], m = (x, y, w, h) => [...px(x, y), w * MS, h * MS];
  ctx.lineCap = 'round'; ctx.strokeStyle = C.site; ctx.lineWidth = 10 * MS; ctx.globalAlpha = .7;
  const [p0, c1, c2, p1] = F.road.map(p => px(...p));
  ctx.beginPath(); ctx.moveTo(...p0); ctx.bezierCurveTo(...c1, ...c2, ...p1); ctx.stroke();
  if (F.rows) { ctx.lineWidth = 1; ctx.globalAlpha = .35; for (let y = F.rows[0]; y <= F.rows[1]; y += F.rows[2]) line(...px(0, y), ...px(SITE.w, y)); ctx.globalAlpha = .7; }
  ctx.fillStyle = C.site;
  for (const [x, y, w, h] of F.bldg) ctx.fillRect(...m(x, y, w, h));
  for (const [x, y, r] of [...F.tree || [], ...F.pile || []]) { ctx.beginPath(); ctx.arc(...px(x, y), r * MS, 0, 7); ctx.fill(); }
  ctx.strokeStyle = C.muted; ctx.lineWidth = 1;
  for (const [x, y, r] of F.pile || []) { ctx.beginPath(); ctx.arc(...px(x, y), r * MS / 2, 0, 7); ctx.stroke(); }
  ctx.globalAlpha = 1; ctx.lineCap = 'butt';
  ctx.setLineDash([6, 4]);
  for (const [x, y, w, h] of F.pit || []) {
    const [a, b, pw, ph] = m(x, y, w, h);
    ctx.strokeRect(a, b, pw, ph); ctx.save(); ctx.beginPath(); ctx.rect(a, b, pw, ph); ctx.clip();
    ctx.setLineDash([]); ctx.globalAlpha = .4; for (let k = -ph; k < pw; k += 8) line(a + k, b + ph, a + k + ph, b); ctx.restore();
  }
  if (S.scenario !== 'town') for (const [x, y, r] of F.low || []) { ctx.beginPath(); ctx.arc(...px(x, y), r * MS, 0, 7); ctx.stroke(); } // town's low spot is for Analysis only
  ctx.strokeRect(OX, OY, SITE.w * MS, SITE.h * MS); ctx.setLineDash([]);
  siteLabel();
}
function lbl(s, x, y, o = {}) {                                // text on a small backing rect so overlays can't hide it
  const z = o.size || 11; ctx.font = `${o.weight || 400} ${z}px "IBM Plex Mono",monospace`;
  const w = ctx.measureText(s).width, x0 = o.align === 'center' ? x - w / 2 : x;
  ctx.fillStyle = C.panel; ctx.globalAlpha = .9; ctx.fillRect(x0 - 3, y - z - 1, w + 6, z + 6); ctx.globalAlpha = 1; txt(s, x, y, o);
}
const siteLabel = () => lbl(`${SCN[S.scenario].label} · 400 × 250 m`, OX, OY + SITE.h * MS + 16);
function drone(x, y) {
  ctx.strokeStyle = C.ink; ctx.lineWidth = 2;
  line(x - 7, y - 7, x + 7, y + 7); line(x - 7, y + 7, x + 7, y - 7);
  ctx.lineWidth = 1.2;
  for (const [dx, dy] of [[-7, -7], [7, -7], [-7, 7], [7, 7]]) { ctx.beginPath(); ctx.arc(x + dx, y + dy, 4, 0, 7); ctx.stroke(); }
  ctx.fillStyle = C.ink; ctx.fillRect(x - 3, y - 3, 6, 6);
}
function plane(x, y, a) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.strokeStyle = ctx.fillStyle = C.ink;
  ctx.lineWidth = 3; line(-9, 0, 9, 0); ctx.lineWidth = 2; line(2, -13, 2, 13); ctx.lineWidth = 1.5; line(-9, -5, -9, 5); ctx.restore();
}
const craft = (x, y, a = 0) => S.uav === 'fixed' ? plane(x, y, a) : drone(x, y);
function arrow(x, y, len, ang, col) {
  const ex = x + Math.cos(ang) * len, ey = y + Math.sin(ang) * len;
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 1.5; line(x, y, ex, ey);
  ctx.beginPath(); ctx.moveTo(ex, ey);
  ctx.lineTo(ex - 5 * Math.cos(ang - .5), ey - 5 * Math.sin(ang - .5));
  ctx.lineTo(ex - 5 * Math.cos(ang + .5), ey - 5 * Math.sin(ang + .5)); ctx.fill();
}

/* ---------- flight plan math ---------- */
let fCache = {};
function flight(o = S) {
  const key = o.alt + '/' + o.overlap + '/' + o.uav + '/' + o.sensor;
  if (o === S && fCache.key === key) return fCache;
  const ov = o.overlap / 100, d = DRONES[o.uav], lid = o.sensor === 'lidar';
  let gsd, fw, fh, sp, st, speed, dens, tooFast = false, res;
  if (lid) {                                                  // continuous strip: 10 m slices just for the animation
    fw = 2 * o.alt * Math.tan(35 * Math.PI / 180); fh = st = 10; sp = fw * (1 - ov); speed = 10;
    dens = SENS.lidar.rate / (speed * sp); res = Math.max(.03, .5 / Math.sqrt(dens));
  } else {
    const c = SENS[o.sensor];
    gsd = c.sw * o.alt * 100 / (c.f * c.iw);                  // cm per pixel
    fw = gsd * c.iw / 100; fh = gsd * c.ih / 100;             // footprint across / along track, m
    sp = fw * (1 - ov); st = fh * (1 - ov);                   // line spacing, photo spacing
    speed = o.uav === 'fixed' ? d.speed : Math.min(d.speed, st / d.minInt); // quad: camera can't fire faster than every minInt s
    tooFast = o.uav === 'fixed' && st / speed < d.minInt; res = 1.5 * gsd / 100;
  }
  const lines = Math.ceil(SITE.h / sp) + 1, per = Math.ceil(SITE.w / st) + 1;
  const y0 = (SITE.h - (lines - 1) * sp) / 2, x0 = (SITE.w - (per - 1) * st) / 2, photos = [];
  for (let l = 0; l < lines; l++) for (let i = 0; i < per; i++) {
    const j = l % 2 ? per - 1 - i : i;                        // serpentine "lawnmower"
    photos.push({ x: x0 + j * st, y: y0 + l * sp });
  }
  const time = (lines * (per - 1) * st + (lines - 1) * sp) / speed + (lines - 1) * d.turn;
  const r = { key, gsd, fw, fh, sp, st, lines, per, photos, time, res, speed, dens, tooFast, endur: d.endur[o.sensor] || d.endur.rgb };
  return o === S ? fCache = r : r;
}
function selfTest() {
  try {
    const q = flight({ ...S }), fx = flight({ ...S, uav: 'fixed' }), li = flight({ ...S, sensor: 'lidar' });
    const ok = (c, m) => { if (!c) throw new Error(m); };
    ok(q.photos.length === 136, 'photos ' + q.photos.length); ok(Math.abs(q.gsd - 2.74) < .01, 'gsd ' + q.gsd);
    ok(Math.abs(q.time - 344.5) < .5, 'time ' + q.time); ok(Math.abs(fx.time - 300) < 1, 'fixed ' + fx.time);
    ok(Math.abs(li.dens - 686) < 1, 'dens ' + li.dens);
    console.log('selfTest OK');
  } catch (e) { console.error('selfTest FAIL', e); }
}

/* ---------- GCP / RTK error model ---------- */
// ponytail: toy model (shift + scale/rotation + slight bend), not a bundle adjustment. Tuned so the lessons read right.
const det3 = m => m[0][0] * (m[1][1] * m[2][2] - m[1][2] * m[2][1]) - m[0][1] * (m[1][0] * m[2][2] - m[1][2] * m[2][0]) + m[0][2] * (m[1][0] * m[2][1] - m[1][1] * m[2][0]);
function fitAffine(obs) {
  const M = [[0, 0, 0], [0, 0, 0], [0, 0, 0]], b = [[0, 0, 0], [0, 0, 0]];
  for (const p of obs) {
    const r = [1, p.u, p.v];
    for (let i = 0; i < 3; i++) { for (let j = 0; j < 3; j++) M[i][j] += r[i] * r[j]; b[0][i] += r[i] * p.o[0]; b[1][i] += r[i] * p.o[1]; }
  }
  const D = det3(M);
  if (Math.abs(D) < 1e-7) return null;                        // collinear GCPs: can't solve tilt
  return b.map(bb => [0, 1, 2].map(c => det3(M.map((row, i) => row.map((x, j) => j === c ? bb[i] : x))) / D));
}
function errField() {
  const k = S.rtk ? 0.02 : 1;
  const uv = (x, y) => [(x - 200) / 200, (y - 125) / 200];
